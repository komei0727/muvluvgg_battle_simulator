# 通常戦闘の評価設定サンプル。個人ファイルなしで計画を作れる
# （`battle_lab.evaluation.plan_battle_evaluation`）。
#
# パスはこのファイルの位置を基準に解決する（絶対パスも可）。どのディレクトリから
# 実行しても同じファイルを指す。
format: BATTLE
seed: example-1
# 再送込みの送信試行数の上限。部分応答で未完了だった試行の再送も数える。
budget: { maxSubmittedRuns: 400 }
api:
  baseUrl: http://localhost:3000
  # 配備の BATTLE_EVALUATION_MAX_CASES / BATTLE_EVALUATION_MAX_TOTAL_RUNS 以下にする。
  # 省略するとAPIの既定値（64 / 300）を使う。
  maxCasesPerRequest: 64
  maxRunsPerRequest: 300
# 手持ちデータを当てるなら inputs を書く（tools/data/inputs/ が既定の置き場所）。
#   inputs:
#     formationsDir: ../../data/inputs/formations
#     playerData: ../../data/inputs/player-data/player-data.json
#     playerDataSides: [ALLY]
# 評価実行の保存先（<evaluationsDir>/<evaluation-id>/evaluation.sqlite3）。tools/data/ は gitignore 済み。
output:
  evaluationsDir: ../../data/evaluations
cases:
  - caseId: example
    match: match.example.yaml
    runs: 100
  - caseId: example-spot-check
    match: match.example.yaml
    # 不連続な試行番号も書ける。同じ対戦条件・seed・番号なら同じ結果になる。
    runIndices: [0, 1, 42]
