# yaml-language-server: $schema=../.schema/evaluation.schema.json
# 戦術演習の初期設定。evaluation.yaml として使い、starts を自分の編成IDに変える。
# 編成IDは inputs.formationsDir に置いたYAMLのファイル名から拡張子を除いたもの。
# パスはこのYAMLの位置を基準に解決する。
enemy:
  unitDefinitionId: UNIT_ANIS_SWEETDEVIL_TEX
  position: { column: 1, row: REAR }
starts:
  - my-team
  - my-team-variant
inputs:
  formationsDir: ../../data/inputs/formations
  # playerData: ../../data/inputs/player-data/player-data.json

moves:
  replaceUnits: true
  moveUnits: true
  replaceMemories: true
  reorderMemories: true
space:
  # 自分の編成に合わせ、差し替え候補と全起点ですでに使うIDを含める。
  unitPool:
    - UNIT_JUNKA_CHILDHOOD
    - UNIT_SAYA_BUNNY
    - UNIT_ELENA_MOODMAKER
    - UNIT_LAYLA_ENTREPRENEUR
    - UNIT_SUIRAN_CHAOS
    - UNIT_YURIA_WILDCARD
  memoryPool:
    - MEM_GIDDY_CIRCUMSTANCES
    - MEM_YOUR_SECRET_I_WANT_TO_KNOW
    - MEM_EURO_TOWER_DAY
    - MEM_TIMID_REINDEER_EVE
    - MEM_HEART_COLOR
    - MEM_ABSOLUTE_ORDER
    - MEM_KOI
  minUnits: 5
  maxUnits: 5
  minMemories: 6
  maxMemories: 6

gear:
  # ADJUSTABLE のときはユニット単位で付け替える。同じ能力のギアは1人につき最大3個。
  mode: FIXED
objective:
  metric: EXPECTED_DAILY_BEST # 1試行あたりの平均を使う場合は MEAN_SCORE
  bestOf: 5
trials:
  screeningRuns: 32
  # 追加検証に進める候補数。基準編成はこの数に含めない。
  finalists: 3
  confirmationRuns: 96
  confirmationSeed: example-confirmation-1
execution:
  candidateSeed: example-candidates-1
  battleSeed: example-screening-1
  budget: { maxSubmittedRuns: 2000 }
  api: { baseUrl: "http://localhost:3000" }
output:
  searchesDir: ../../data/searches
