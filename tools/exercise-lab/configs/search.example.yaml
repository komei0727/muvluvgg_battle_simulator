# 何を最大化するか。スコアアタックは1日 bestOf 回（既定5回）挑戦してベストで競うので、
# 適応度は λ*E[bestOf回中のベスト] + (1-λ)*保証値 とする。
# 保証値は日次ベストの guardQuantile 分位点（0.25 なら「4日に3日はこれ以上出る」値）。
#
# bestOf を上げるほど上振れ重視になるが、推定に効く実効サンプル数は n(2k-1)/k² に
# 縮むので、上げたら finalStageRuns も増やす。lambda=1 で純粋な期待日次ベストになる。
#
# objective:
#   bestOf: 5
#   lambda: 0.5
#   guardQuantile: 0.25

# 制約。省略時は「重複ユニット禁止・固定なし」。
#
# constraints:
#   allowDuplicateUnits: false
#   # マスまで固定する（配置も探索対象から外れる）
#   fixedPlacements:
#     - unitDefinitionId: UNIT_JUNKA_CHILDHOOD
#       position: { column: 0, row: FRONT }
#   # 必ず入れるが配置は探索させる
#   requiredUnits: [UNIT_ELENA_MOODMAKER]
#   # 必ず入れるメモリー
#   requiredMemories: [MEM_HEART_COLOR]

# 評価スケジュール。段ごとの値は累計試行数で、上位半分だけが次の段へ進む。
# 第1段は中央値だけで篩う（期待日次ベストの実効サンプルが育っていないため。
# 平均だと稀に崩れる高天井編成を浅い段で殺してしまう）。
#
# schedule:
#   populationSize: 40
#   stageRuns: [8, 24, 72]
#   finalPoolSize: 24
#   finalStageRuns: [50, 100]
#   topK: 5
#   patience: 8

# 近傍生成の重み。配置とメモリーの最適化が主で、ユニット入替は低頻度にしてある。
# 未知のユニット組み合わせをもっと探したいなら unitSwap / unitAdd を上げる。
#
# operatorWeights:
#   unitSwap: 0.18
#   unitAdd: 0.06
#   unitRemove: 0.02
#   placementMove: 0.17
#   placementSwap: 0.17
#   rowFlip: 0.09
#   memorySwap: 0.19
#   memoryAdd: 0.07
#   memoryRemove: 0.05

# 強化を YAML 側で固定したい場合（--player-data を使わない場合）は次を足す。
# 省略したキーは 1 として送る（R-ENH-01）。
#
# academyLevels:
#   unitTypes: { PHYSICAL: 99, ENERGY: 100, AGILE: 101 }
#   attributes: { AGGRESSIVE: 102, SHY: 103, CUTE: 101, SMART: 102, COMICAL: 26, CLEVER: 27 }
