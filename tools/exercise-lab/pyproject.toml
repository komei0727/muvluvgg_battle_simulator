[project]
name = "exercise-lab"
version = "0.1.0"
description = "Tactical exercise lab: exercise inputs, exercise-specific statistics and the input helper CLI"
requires-python = ">=3.12"
dependencies = [
    "mlgg-lab-common[statistics,cli]",
    "pydantic>=2.9",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
# ラボごとに接頭辞を付ける。workspaceは1つのvenvへ全ラボのコマンドを入れるため、
# 共通名（`lab`）だと後から入ったラボのコマンドが黙って上書きする。
exercise-lab = "exercise_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exercise_lab"]
