[project]
name = "mlgg-lab-common"
version = "0.1.0"
description = "Format-independent formation models, input loaders and descriptive statistics for the analysis labs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 記述統計（mlgg_lab_common.statistics）だけが使う。入力の取り込みだけを使うラボへ
# 数値計算ライブラリを持ち込まないよう、実行時依存から分けておく。
statistics = ["numpy>=2.1"]
# 各ラボの評価コマンドの共通部（mlgg_lab_common.cli）だけが使う。Pythonから集計・出力
# （mlgg_lab_common.reporting）だけを使うなら要らない。
cli = ["rich>=13.9", "typer>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlgg_lab_common"]
