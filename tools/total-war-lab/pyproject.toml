[project]
name = "total-war-lab"
version = "0.1.0"
description = "Total war lab: match inputs (ordered formation lists) and format-specific validation"
requires-python = ">=3.12"
dependencies = [
    "mlgg-lab-common",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/total_war_lab"]
