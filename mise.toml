min_version = "2026.6.14"

[tools]
node = "24.18.0"
pnpm = "11.8.0"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
minimum_release_age = "24h"

[tasks.install]
description = "Install dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start the development server"
depends = ["install"]
# Defaults CORS to the ui:dev task's port so `mise run dev` + `mise run
# ui:dev` work together out of the box; export CORS_ALLOWED_ORIGINS yourself
# to override (e.g. a different UI port).
run = "CORS_ALLOWED_ORIGINS=\"${CORS_ALLOWED_ORIGINS:-http://localhost:5173}\" EVALUATION_ENDPOINT_ENABLED=\"${EVALUATION_ENDPOINT_ENABLED:-true}\" pnpm --filter api run dev"

[tasks.typecheck]
run = "pnpm --filter api run typecheck"

[tasks.lint]
run = "pnpm --filter api run lint"

[tasks."format:check"]
run = "pnpm run format:check"

[tasks.test]
run = "pnpm --filter api run test"

[tasks."test:coverage"]
description = "Run unit/scenario/contract tests with coverage report"
run = "pnpm --filter api run test:coverage"

[tasks."test:integration"]
description = "Run Worker and HTTP integration tests"
run = "pnpm --filter api run test:integration"

[tasks."test:e2e"]
description = "Run end-to-end tests (HTTP to Worker to Battle)"
run = "pnpm --filter api run test:e2e"

[tasks."test:load"]
description = "Run load and soak tests (nightly / pre-release)"
run = "pnpm --filter api run test:load"

[tasks.build]
run = "pnpm --filter api run build"

[tasks."check:circular"]
description = "Detect circular dependencies between source files"
run = "pnpm --filter api run check:circular"

[tasks.validate-catalog]
description = "Validate a Catalog directory against the runtime schema (args: <catalog-dir>, relative to apps/api/)"
run = "pnpm --filter api run validate-catalog"

[tasks.generate-catalog]
description = "Regenerate catalog/ deterministically from catalog-src/ (args: <catalog-src-dir> <catalog-dir> <catalogRevision>, paths relative to apps/api/)"
run = "pnpm --filter api run generate-catalog"

[tasks.check-catalog-src]
description = "Fail if catalog/ drifted from what regenerating from catalog-src/ would produce (args: <catalog-src-dir> <catalog-dir>, paths relative to apps/api/)"
run = "pnpm --filter api run check-catalog-src"

[tasks.generate-ui-fixtures]
description = "Regenerate apps/ui/src/test/fixtures/*.json from real API contract responses (REF-053)"
run = "pnpm --filter api run generate-ui-fixtures"

[tasks.check-ui-fixtures]
description = "Fail if apps/ui/src/test/fixtures/*.json drifted from what regenerating them would produce (REF-053)"
run = "pnpm --filter api run check-ui-fixtures"

[tasks.render-cloud-run-manifest]
description = "Render the Cloud Run Knative service manifest to stdout (env: MANIFEST_TEMPLATE_PATH, IMAGE, REVISION_NAME, PREVIOUS_REVISION_NAME, RUNTIME_SERVICE_ACCOUNT_EMAIL required)"
run = "pnpm --filter api run render-cloud-run-manifest"

[tasks."test:container"]
description = "Build the production container image and run local Docker smoke tests (non-root, PORT/HOST, Catalog/Worker/OpenAPI, SIGTERM)"
run = "bash scripts/container-smoke-test.sh"

[tasks."ci:test"]
description = "Test the CI changed-path classification logic (scripts/ci/)"
run = "node --test scripts/ci/*.test.mjs"

[tasks.check]
description = "Fast local validation (api+ui typecheck/lint/test/build; no coverage, container, or e2e). The canonical PR-equivalent gate is `bash scripts/run-quality-gates.sh`"
depends = [
  "typecheck",
  "lint",
  "format:check",
  "test",
  "build",
  "check:circular",
  "check-ui-fixtures",
  "ui:typecheck",
  "ui:lint",
  "ui:openapi:check",
  "ui:test",
  "ui:build",
  "ci:test",
]

[tasks."ui:typecheck"]
description = "Type-check the apps/ui/ workspace"
run = "pnpm --filter ui run typecheck"

[tasks."ui:lint"]
description = "Lint the apps/ui/ workspace"
run = "pnpm --filter ui run lint"

[tasks."ui:openapi:check"]
description = "Fail if src/shared/api/generated/v1.d.ts drifted from apps/api/openapi/v1-baseline.json (REF-052)"
run = "pnpm --filter ui run openapi:check"

[tasks."ui:openapi:generate"]
description = "Regenerate src/shared/api/generated/v1.d.ts from apps/api/openapi/v1-baseline.json (REF-052)"
run = "pnpm --filter ui run openapi:generate"

[tasks."ui:test"]
description = "Run apps/ui/ unit and component tests"
run = "pnpm --filter ui run test"

[tasks."ui:test:coverage"]
description = "Run apps/ui/ unit and component tests with coverage report and threshold check (PR CI equivalent)"
run = "pnpm --filter ui run test:coverage"

[tasks."ui:build"]
description = "Build the apps/ui/ workspace for production"
run = "pnpm --filter ui run build"

[tasks."ui:e2e"]
description = "Run apps/ui/ Playwright end-to-end smoke tests (excludes @visual: platform-portable, safe on any local OS)"
run = "pnpm --filter ui run test:e2e"

[tasks."ui:e2e:visual"]
description = "Run apps/ui/ Playwright visual regression tests (@visual only; baselines are Linux-only, CI-use is expected)"
run = "pnpm --filter ui run test:e2e:visual"

[tasks."ui:e2e:live"]
description = "Run apps/ui/ Playwright live smoke tests against a deployed GitHub Pages origin and Cloud Run API (requires LIVE_PAGES_URL/LIVE_API_BASE_URL; main-branch deploy only, never part of `mise run check`)"
run = "pnpm --filter ui run test:e2e:live"

[tasks."ui:dev"]
# Defaults to the dev task's port so the two work together out of the box;
# export VITE_API_BASE_URL yourself to override (e.g. a different API port).
run = "VITE_API_BASE_URL=\"${VITE_API_BASE_URL:-http://localhost:3000}\" pnpm --filter ui exec vite --port 5173"
